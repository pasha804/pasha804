<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="100%">
  
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54B948" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54B948" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#555555" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0072C6" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54B948" />
      <stop offset="50%" stop-color="#0072C6" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <filter id="glow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .gta-title { font-family: 'Impact', 'Arial Black', sans-serif; font-style: italic; text-transform: uppercase; stroke: #000; stroke-width: 0.8px; }
    .gta-mission { font-family: 'Impact', 'Arial Black', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>


  <rect width="920" height="170" rx="12" fill="url(#db-bg)" stroke="url(#border-glow)" stroke-width="1.5" />

  <g transform="translate(28, 22)">
    <rect width="6" height="16" fill="#54B948" rx="2" />
    <text x="16" y="13" fill="#f8fafc" class="gta-title" font-size="14" font-weight="800">THIS MONTH // PAYOUTS</text>
    <text x="864" y="13" fill="#64748b" class="mono" font-size="10" text-anchor="end">DYNAMIC TELEMETRY</text>
  </g>
  <line x1="28" y1="44" x2="892" y2="44" stroke="#333333" stroke-width="1" />

  <g transform="translate(28, 56)">
    
    <g transform="translate(0, 0)">
      <rect width="200" height="95" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">MONTHLY PAYOUT</text>
      <text x="14" y="62" fill="#54B948" class="mono" font-size="30" font-weight="900">56</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">THIS MONTH</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="200" height="95" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">DAYS SURVIVED</text>
      <text x="14" y="62" fill="#0072C6" class="mono" font-size="30" font-weight="900">8</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">DAYS ACTIVE</text>
    </g>
    <g transform="translate(444, 0)">
      <rect width="200" height="95" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">FRONTS ACTIVE</text>
      <text x="14" y="62" fill="#FF007F" class="mono" font-size="30" font-weight="900">15</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">BUSINESSES</text>
    </g>
    <g transform="translate(666, 0)">
      <rect width="200" height="95" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">CADENCE RATIO</text>
      <text x="14" y="62" fill="#F2A900" class="mono" font-size="30" font-weight="900">7.0</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">COMMITS / ACTIVE DAY</text>
    </g>
  </g>
</svg>
