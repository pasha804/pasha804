<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="100%">
  
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>


  <rect width="920" height="170" rx="12" fill="url(#db-bg)" stroke="url(#border-glow)" stroke-width="1.5" />

  <g transform="translate(28, 22)">
    <rect width="6" height="16" fill="#38bdf8" rx="2" />
    <text x="16" y="13" fill="#f8fafc" class="sans" font-size="14" font-weight="800">THIS MONTH // SEPTEMBER 2026</text>
    <text x="864" y="13" fill="#64748b" class="mono" font-size="10" text-anchor="end">DYNAMIC TELEMETRY</text>
  </g>
  <line x1="28" y1="44" x2="892" y2="44" stroke="#1e293b" stroke-width="1" />

  <g transform="translate(28, 56)">
    
    <g transform="translate(0, 0)">
      <rect width="200" height="95" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">MONTH CONTRIBUTIONS</text>
      <text x="14" y="62" fill="#38bdf8" class="mono" font-size="30" font-weight="900">42</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">THIS MONTH</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="200" height="95" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">ACTIVE DAYS</text>
      <text x="14" y="62" fill="#818cf8" class="mono" font-size="30" font-weight="900">6</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">DAYS WITH COMMITS</text>
    </g>
    <g transform="translate(444, 0)">
      <rect width="200" height="95" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">REPOSITORIES ACTIVE</text>
      <text x="14" y="62" fill="#c084fc" class="mono" font-size="30" font-weight="900">15</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">ECOSYSTEM</text>
    </g>
    <g transform="translate(666, 0)">
      <rect width="200" height="95" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" class="mono" font-size="9" font-weight="700">CADENCE RATIO</text>
      <text x="14" y="62" fill="#fde047" class="mono" font-size="30" font-weight="900">7.0</text>
      <text x="14" y="82" fill="#94a3b8" class="mono" font-size="9">COMMITS / ACTIVE DAY</text>
    </g>
  </g>
</svg>
