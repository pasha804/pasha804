        <text x="16" y="18" fill="#94a3b8" class="mono" font-size="10">SURVIVAL TIME</text>
        <text x="16" y="33" fill="#64748b" class="mono" font-size="8">CONSECUTIVE DAYS SURVIVED</text>
        <text x="386" y="27" fill="#C00000" class="mono" font-size="16" font-weight="900" text-anchor="end">1 DAYS</text>
      </g>
  </g>

  <g transform="translate(24, 320)">
    <circle cx="4" cy="4" r="3.5" fill="#10b981" class="pulse" />
