  </g>
  <line x1="24" y1="48" x2="426" y2="48" stroke="#333333" stroke-width="1" />

  <g transform="translate(24, 60)">
    
      <g transform="translate(0, 0)">
        <rect width="402" height="42" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
        <text x="16" y="18" fill="#94a3b8" class="mono" font-size="10">TOTAL HEISTS</text>
        <text x="16" y="33" fill="#64748b" class="mono" font-size="8">VERIFIED MISSIONS PASSED</text>
        <text x="386" y="27" fill="#54B948" class="mono" font-size="16" font-weight="900" text-anchor="end">230</text>
      </g>
      <g transform="translate(0, 50)">
        <rect width="402" height="42" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
        <text x="16" y="18" fill="#94a3b8" class="mono" font-size="10">PROPERTIES OWNED</text>
        <text x="16" y="33" fill="#64748b" class="mono" font-size="8">SAFEHOUSES &amp; BUSINESSES</text>
        <text x="386" y="27" fill="#0072C6" class="mono" font-size="16" font-weight="900" text-anchor="end">59</text>
      </g>
      <g transform="translate(0, 100)">
        <rect width="402" height="42" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
        <text x="16" y="18" fill="#94a3b8" class="mono" font-size="10">CREW MEMBERS</text>
        <text x="16" y="33" fill="#64748b" class="mono" font-size="8">GANG NETWORK</text>
        <text x="386" y="27" fill="#39FF14" class="mono" font-size="16" font-weight="900" text-anchor="end">0</text>
      </g>
      <g transform="translate(0, 150)">
        <rect width="402" height="42" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
