<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="100%" height="100%">
  
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070B" />
      <stop offset="50%" stop-color="#0B0D15" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2E3650" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .gta-title { font-family: Georgia, serif; font-style: italic; letter-spacing: 0.5px; }
    .gta-mission { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.5px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>


  <rect width="920" height="140" rx="10" fill="#06070B" stroke="#1F2436" stroke-width="1.5" />

  <g transform="translate(24, 18)">
    
    <g transform="translate(0, 0)">
      <rect width="200" height="104" rx="6" fill="#0F121C" stroke="#1F2436" stroke-width="1" />
      <text x="16" y="26" fill="#64748B" class="mono" font-size="9" font-weight="700">SAFEHOUSES</text>
      <text x="16" y="66" fill="#38BDF8" class="mono" font-size="32" font-weight="900">64</text>
      <text x="16" y="88" fill="#94A3B8" class="mono" font-size="8">PROPERTIES</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="200" height="104" rx="6" fill="#0F121C" stroke="#1F2436" stroke-width="1" />
      <text x="16" y="26" fill="#64748B" class="mono" font-size="9" font-weight="700">RESPECT</text>
      <text x="16" y="66" fill="#6366F1" class="mono" font-size="32" font-weight="900">290</text>
      <text x="16" y="88" fill="#94A3B8" class="mono" font-size="8">ALL TIME</text>
    </g>
    <g transform="translate(444, 0)">
      <rect width="200" height="104" rx="6" fill="#0F121C" stroke="#1F2436" stroke-width="1" />
      <text x="16" y="26" fill="#64748B" class="mono" font-size="9" font-weight="700">CREW</text>
      <text x="16" y="66" fill="#A855F7" class="mono" font-size="32" font-weight="900">0</text>
      <text x="16" y="88" fill="#94A3B8" class="mono" font-size="8">NETWORK</text>
    </g>
    <g transform="translate(666, 0)">
      <rect width="200" height="104" rx="6" fill="#0F121C" stroke="#1F2436" stroke-width="1" />
      <text x="16" y="26" fill="#64748B" class="mono" font-size="9" font-weight="700">BOUNTY</text>
      <text x="16" y="66" fill="#FBBF24" class="mono" font-size="32" font-weight="900">10</text>
      <text x="16" y="88" fill="#94A3B8" class="mono" font-size="8">RESPECT</text>
    </g>
  </g>
</svg>
