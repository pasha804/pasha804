<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="100%" height="100%">
  
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>


  <rect width="920" height="210" rx="12" fill="url(#db-bg)" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(28, 24)">
    <circle cx="6" cy="7" r="3.5" fill="#10b981" class="pulse" />
    <text x="20" y="11" fill="#f8fafc" class="sans" font-size="14" font-weight="800">GITHUB // COMMAND CENTER TELEMETRY</text>
    
    <g transform="translate(380, -2)">
      <rect width="68.0" height="20" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.8" />
      <text x="34.0" y="14" fill="#10b981" class="mono" font-size="9" font-weight="800" text-anchor="middle">LIVE API</text>
    </g>
    <text x="864" y="11" fill="#64748b" class="mono" font-size="10" text-anchor="end">SYNC: 2026-09-22 18:28 UTC</text>
  </g>
  <line x1="28" y1="48" x2="892" y2="48" stroke="#1e293b" stroke-width="1" />

  <!-- Metric Cards -->
  <g transform="translate(28, 68)">
    
    <g transform="translate(0, 0)">
      <rect width="200" height="120" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="200" height="3" rx="1.5" fill="#38bdf8" y="0" />
      <text x="16" y="30" fill="#64748b" class="mono" font-size="9" font-weight="700">PUBLIC REPOS</text>
      <text x="16" y="72" fill="#38bdf8" class="mono" font-size="36" font-weight="900">59</text>
      <text x="16" y="104" fill="#94a3b8" class="mono" font-size="9">INDEXED</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="200" height="120" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="200" height="3" rx="1.5" fill="#818cf8" y="0" />
      <text x="16" y="30" fill="#64748b" class="mono" font-size="9" font-weight="700">CONTRIBUTIONS</text>
      <text x="16" y="72" fill="#818cf8" class="mono" font-size="36" font-weight="900">226</text>
      <text x="16" y="104" fill="#94a3b8" class="mono" font-size="9">THIS YEAR</text>
    </g>
    <g transform="translate(444, 0)">
      <rect width="200" height="120" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="200" height="3" rx="1.5" fill="#34d399" y="0" />
      <text x="16" y="30" fill="#64748b" class="mono" font-size="9" font-weight="700">ACTIVE STREAK</text>
      <text x="16" y="72" fill="#34d399" class="mono" font-size="36" font-weight="900">1</text>
      <text x="16" y="104" fill="#94a3b8" class="mono" font-size="9">BEST: 4d</text>
    </g>
    <g transform="translate(666, 0)">
      <rect width="200" height="120" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="200" height="3" rx="1.5" fill="#fde047" y="0" />
      <text x="16" y="30" fill="#64748b" class="mono" font-size="9" font-weight="700">FOLLOWERS</text>
      <text x="16" y="72" fill="#fde047" class="mono" font-size="36" font-weight="900">0</text>
      <text x="16" y="104" fill="#94a3b8" class="mono" font-size="9">NETWORK</text>
    </g>
  </g>
</svg>
