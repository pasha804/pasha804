  <style>
    :root {
      --bg: #030712;
      --card-bg: #071228;
      --border: #1e3a8a;
      --border-accent: #0284c7;
      --text: #94a3b8;
      --text-bright: #f0f9ff;
      --primary: #0066FF;
      --cyan: #38BDF8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .preview-container {
      max-width: 1040px;
      width: 100%;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 18, 40, 0.85);
      border: 1px solid var(--border);
      padding: 14px 24px;
      border-radius: 14px;
      margin-bottom: 28px;
      position: sticky;
      top: 16px;
      z-index: 100;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 102, 255, 0.15);
    }
    .badge {
      background: linear-gradient(135deg, #0066FF, #38BDF8);
      color: #030712;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .status-text {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--cyan);
    }
    .btn {
      background: linear-gradient(135deg, #0066FF, #0284c7);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-block;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
    }
    .content-stream {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .content-stream img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .content-stream a img:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(0, 102, 255, 0.25);
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 16px 0;
    }
    .badges-row img {
      width: auto !important;
      height: 32px !important;
      border-radius: 4px !important;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .footer-note {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      border-top: 1px solid var(--border);
    }
