name: Update Profile Telemetry & Dashboard

on:
  schedule:
    # Refresh every 6 hours for live telemetry
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_profile.py'
      - '.github/workflows/profile-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Live Profile Telemetry Dashboards
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          python scripts/generate_profile.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --staged --quiet; then
            echo "No changes detected in profile dashboards. Working tree clean."
          else
            git commit -m "chore(telemetry): refresh live profile dashboards [skip ci]"
            git push origin main
          fi
