<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 Architecture Systems that scale with poise.">
  <defs>
    <linearGradient id="ta-line-06" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset=".6" stop-color="#0066FF"/>
      <stop offset="1" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ta-sheen-06" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset=".5" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#93C5FD"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ta-pulse-06"><stop offset="0" stop-color="#F0F9FF"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".7"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ta-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .ta-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .ta-in { animation: ta-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .ta-d2 { animation-delay: .2s; } .ta-d3 { animation-delay: .45s; }
    .ta-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: ta-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes ta-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ta-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ta-in { animation: none; } .ta-draw { stroke-dashoffset: 0; } }
  </style>
  <g class="ta-in">
    <text class="ta-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#38BDF8"><tspan fill="#60A5FA">06</tspan>   ARCHITECTURE</text>
  </g>
  <g class="ta-in ta-d2">
    <text class="ta-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F0F9FF">Architecture, <tspan font-style="italic" fill="url(#ta-sheen-06)">Systems that scale with poise.</tspan></text>
  </g>
  <g class="ta-in ta-d3">
    <text class="ta-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#94A3B8">ENGINEERING BLUEPRINT</text>
    <text class="ta-mono" x="1160" y="84" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#38BDF8">END-TO-END PIPELINE</text>
  </g>
  <path class="ta-draw" d="M40 106 H1160" stroke="url(#ta-line-06)" stroke-width="1.2"/>
  <circle cx="40" cy="106" r="7" fill="url(#ta-pulse-06)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>