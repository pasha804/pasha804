<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="100%">
  <defs>
    <!-- Heavy GTA Drop Shadows -->
    <filter id="gta-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .gta-script {
      font-family: 'Brush Script MT', 'Lucida Handwriting', 'Segoe Script', cursive, sans-serif;
      font-size: 34px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .gta-pricedown {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 88px;
      font-style: italic;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: -2px;
      stroke: #000000;
      stroke-width: 6px;
      paint-order: stroke fill;
    }
    .gta-edition {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
      fill: #000000;
      font-weight: 900;
    }
    .mono { font-family: 'JetBrains Mono', Menlo, monospace; }
  </style>

  <!-- Dark Atmospheric Background -->
  <rect width="940" height="240" rx="12" fill="#030406" stroke="#1f2937" stroke-width="1.5" />

  <!-- Rockstar Games Style Emblem on Top-Left -->
  <g transform="translate(36, 28)">
    <rect width="44" height="44" rx="10" fill="#F5AF00" stroke="#000" stroke-width="2" />
    <text x="22" y="32" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#000" text-anchor="middle">R<tspan font-size="18" dy="-10">★</tspan></text>
  </g>

  <!-- Top Script: grand theft auto -->
  <g transform="translate(470, 52)" text-anchor="middle">
    <text x="0" y="0" class="gta-script" filter="url(#gta-shadow)">grand theft auto</text>
  </g>

  <!-- Main Title: PASHA DEV -->
  <g transform="translate(470, 138)" text-anchor="middle">
    <text x="0" y="0" class="gta-pricedown" filter="url(#gta-shadow)">PASHA DEV</text>
  </g>

  <!-- Edition Badge Banner: LOS SANTOS HEISTS -->
  <g transform="translate(470, 168)" text-anchor="middle">
    <rect x="-160" y="-14" width="320" height="26" rx="4" fill="#F5AF00" stroke="#000" stroke-width="2" />
    <text x="0" y="5" class="gta-edition">LOS SANTOS HEISTS // VI</text>
  </g>

  <!-- Bottom Wanted Stars Bar -->
  <g transform="translate(470, 212)" text-anchor="middle">
    <text x="-90" y="5" fill="#ef4444" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900">WANTED LEVEL</text>
    <g transform="translate(10, -8)">
      <polygon points="10,1 12,7 19,7 13,11 15,18 10,14 4,18 6,11 1,7 8,7" fill="#F5AF00" stroke="#000" stroke-width="1" />
      <polygon points="30,1 32,7 39,7 33,11 35,18 30,14 24,18 26,11 21,7 28,7" fill="#F5AF00" stroke="#000" stroke-width="1" />
      <polygon points="50,1 52,7 59,7 53,11 55,18 50,14 44,18 46,11 41,7 48,7" fill="#F5AF00" stroke="#000" stroke-width="1" />
      <polygon points="70,1 72,7 79,7 73,11 75,18 70,14 64,18 66,11 61,7 68,7" fill="#F5AF00" stroke="#000" stroke-width="1" />
      <polygon points="90,1 92,7 99,7 93,11 95,18 90,14 84,18 86,11 81,7 88,7" fill="#F5AF00" stroke="#000" stroke-width="1" />
    </g>
  </g>

  <!-- Right Side Watermark -->
  <g transform="translate(900, 40)" text-anchor="end" class="mono" font-size="9" fill="#64748b">
    <text x="0" y="0">DISC: 01 // 60 FPS</text>
    <text x="0" y="14">RATING: 18+ ADULTS ONLY</text>
    <text x="0" y="28">CODEBASE // CERTIFIED</text>
  </g>
</svg>
