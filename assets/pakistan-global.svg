<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#04070f" />
    </linearGradient>

    <linearGradient id="route-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="hub-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="world-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="0" cy="0" r="1" fill="#334155" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse-hub {
      0%, 100% { r: 5px; opacity: 1; }
      50% { r: 9px; opacity: 0.5; }
    }
    @keyframes arc-flow {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .pulsing-hub { animation: pulse-hub 2s infinite ease-in-out; }
    .active-arc { stroke-dasharray: 6 6; animation: arc-flow 4s linear infinite; }
  </style>

  <!-- Frame -->
  <rect width="940" height="300" rx="14" fill="url(#pg-bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="940" height="300" rx="14" fill="url(#world-grid)" />

  <!-- Header -->
  <g transform="translate(32, 24)">
    <rect width="32" height="32" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <!-- Radar / Satellite Icon -->
    <circle cx="16" cy="16" r="8" fill="none" stroke="#34d399" stroke-width="1.5" />
    <circle cx="16" cy="16" r="3" fill="#10b981" />
    <line x1="16" y1="8" x2="16" y2="4" stroke="#34d399" stroke-width="1.5" />

    <text x="44" y="16" fill="#f8fafc" class="sans" font-size="17" font-weight="900">GLOBAL TELEMETRY ROUTING // PAKISTAN TO THE WORLD</text>
    <text x="44" y="30" fill="#38bdf8" class="mono" font-size="10" font-weight="700">PRIMARY NODE: LAHORE (31.5204° N, 74.3587° E) • REGION: ASIA-SOUTH-1 • ZERO-BORDER ENGINEERING</text>

    <!-- Status Tag -->
    <rect x="740" y="4" width="136" height="24" rx="5" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <circle cx="752" cy="16" r="4" fill="#10b981" class="pulsing-hub" />
    <text x="762" y="20" fill="#a7f3d0" class="mono" font-size="9" font-weight="800">GLOBAL EDGE LIVE</text>
  </g>

  <line x1="32" y1="68" x2="908" y2="68" stroke="#1e293b" stroke-width="1" />

  <!-- Global Route Map Visual Canvas -->
  <g transform="translate(32, 80)">
    
    <!-- Background Continent Shapes (Stylized technical dot-line clusters) -->
    <!-- Americas -->
    <path d="M 120 30 Q 150 45 180 35 Q 210 70 190 100 Q 160 120 140 100 Z" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
    <!-- Europe / Africa -->
    <path d="M 400 25 Q 440 30 460 55 Q 450 110 420 120 Q 380 90 390 50 Z" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
    <!-- Asia / Pacific -->
    <path d="M 520 25 Q 620 20 720 50 Q 750 90 680 115 Q 560 105 520 70 Z" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />

    <!-- Flight / Telemetry Route Arcs radiating from Lahore (x=560, y=55) -->
    <!-- Arc 1: Lahore to London / EU-WEST-1 (420, 35) -->
    <path d="M 560 55 Q 490 20 420 35" fill="none" stroke="#38bdf8" stroke-width="2" class="active-arc" />
    
    <!-- Arc 2: Lahore to Frankfurt / EU-CENTRAL (450, 42) -->
    <path d="M 560 55 Q 505 32 450 42" fill="none" stroke="#60a5fa" stroke-width="1.8" />

    <!-- Arc 3: Lahore to US East / Virginia (185, 45) -->
    <path d="M 560 55 Q 360 -15 185 45" fill="none" stroke="#818cf8" stroke-width="2" class="active-arc" />

    <!-- Arc 4: Lahore to US West / Silicon Valley (125, 42) -->
    <path d="M 560 55 Q 320 -25 125 42" fill="none" stroke="#c084fc" stroke-width="1.8" />

    <!-- Arc 5: Lahore to Singapore / AP-SOUTHEAST (660, 85) -->
    <path d="M 560 55 Q 610 80 660 85" fill="none" stroke="#34d399" stroke-width="2" class="active-arc" />

    <!-- Arc 6: Lahore to Tokyo / AP-NORTHEAST (725, 48) -->
    <path d="M 560 55 Q 650 30 725 48" fill="none" stroke="#f43f5e" stroke-width="1.8" />

    <!-- Remote Nodes -->
    <!-- Silicon Valley -->
    <circle cx="125" cy="42" r="3.5" fill="#c084fc" />
    <text x="125" y="32" fill="#e9d5ff" class="mono" font-size="8" text-anchor="middle">US-WEST (180ms)</text>

    <!-- Virginia US-East -->
    <circle cx="185" cy="45" r="3.5" fill="#818cf8" />
    <text x="185" y="60" fill="#c7d2fe" class="mono" font-size="8" text-anchor="middle">US-EAST (155ms)</text>

    <!-- London -->
    <circle cx="420" cy="35" r="3.5" fill="#38bdf8" />
    <text x="420" y="24" fill="#bae6fd" class="mono" font-size="8" text-anchor="middle">LONDON (110ms)</text>

    <!-- Frankfurt -->
    <circle cx="450" cy="42" r="3" fill="#60a5fa" />
    <text x="450" y="58" fill="#bfdbfe" class="mono" font-size="8" text-anchor="middle">FRA (105ms)</text>

    <!-- Singapore -->
    <circle cx="660" cy="85" r="3.5" fill="#34d399" />
    <text x="660" y="100" fill="#a7f3d0" class="mono" font-size="8" text-anchor="middle">SIN (75ms)</text>

    <!-- Tokyo -->
    <circle cx="725" cy="48" r="3.5" fill="#f43f5e" />
    <text x="725" y="38" fill="#fecdd3" class="mono" font-size="8" text-anchor="middle">TYO (115ms)</text>

    <!-- LAHORE CORE HUB (Beacon) -->
    <circle cx="560" cy="55" r="14" fill="#10b981" fill-opacity="0.25" filter="url(#hub-glow)" />
    <circle cx="560" cy="55" r="8" fill="#10b981" fill-opacity="0.5" />
    <circle cx="560" cy="55" r="4.5" fill="#ffffff" />
    <!-- Hub Marker Label -->
    <rect x="515" y="68" width="90" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="560" y="80" fill="#a7f3d0" class="mono" font-size="8" font-weight="900" text-anchor="middle">LAHORE [HUB]</text>
  </g>

  <!-- 4 Telemetry Status Cards (Bottom Tier) -->
  <g transform="translate(32, 206)">
    <!-- Card 1 -->
    <g>
      <rect width="206" height="70" rx="8" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#10b981" />
      <text x="26" y="24" fill="#f8fafc" class="sans" font-size="11" font-weight="800">PRIMARY CORE</text>
      <text x="16" y="42" fill="#38bdf8" class="mono" font-size="10" font-weight="700">Lahore, Pakistan</text>
      <text x="16" y="58" fill="#64748b" class="mono" font-size="8">Deep Systems Architecture</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(224, 0)">
      <rect width="206" height="70" rx="8" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#38bdf8" />
      <text x="26" y="24" fill="#f8fafc" class="sans" font-size="11" font-weight="800">GLOBAL DISTRIBUTION</text>
      <text x="16" y="42" fill="#60a5fa" class="mono" font-size="10" font-weight="700">Anycast Edge CDN</text>
      <text x="16" y="58" fill="#64748b" class="mono" font-size="8">Sub-30ms Worldwide TTFB</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(448, 0)">
      <rect width="206" height="70" rx="8" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#818cf8" />
      <text x="26" y="24" fill="#f8fafc" class="sans" font-size="11" font-weight="800">MULTI-CLOUD API</text>
      <text x="16" y="42" fill="#c084fc" class="mono" font-size="10" font-weight="700">FastAPI &amp; Docker</text>
      <text x="16" y="58" fill="#64748b" class="mono" font-size="8">Railway + Vercel Compute</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(672, 0)">
      <rect width="204" height="70" rx="8" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#f59e0b" />
      <text x="26" y="24" fill="#f8fafc" class="sans" font-size="11" font-weight="800">TELEMETRY UPTIME</text>
      <text x="16" y="42" fill="#34d399" class="mono" font-size="10" font-weight="700">99.98% Monitored</text>
      <text x="16" y="58" fill="#64748b" class="mono" font-size="8">Automated CI/CD Workflows</text>
    </g>
  </g>
</svg>
