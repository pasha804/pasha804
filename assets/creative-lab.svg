<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0818" />
      <stop offset="50%" stop-color="#0d0f24" />
      <stop offset="100%" stop-color="#060412" />
    </linearGradient>
    <linearGradient id="cl-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cl-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cl-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="cl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cl-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes orbit-1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbit-2 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes orbit-3 {
      0% { transform: rotate(45deg); }
      100% { transform: rotate(405deg); }
    }
    @keyframes float-up {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes pulse-core {
      0%, 100% { opacity: 0.5; r: 12; }
      50% { opacity: 1; r: 16; }
    }
    @keyframes wave-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes particle-drift {
      0% { opacity: 0; transform: translateY(0) translateX(0); }
      20% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-30px) translateX(15px); }
    }
    .ring-1 { transform-origin: 420px 185px; animation: orbit-1 12s linear infinite; }
    .ring-2 { transform-origin: 420px 185px; animation: orbit-2 18s linear infinite; }
    .ring-3 { transform-origin: 420px 185px; animation: orbit-3 15s linear infinite; }
    .floating { animation: float-up 4s ease-in-out infinite; }
    .floating-delay { animation: float-up 4s ease-in-out infinite 1.5s; }
    .core-pulse { animation: pulse-core 3s ease-in-out infinite; }
    .wave-anim { stroke-dasharray: 12 6; animation: wave-flow 3s linear infinite; }
    .particle-1 { animation: particle-drift 4s ease-out infinite; }
    .particle-2 { animation: particle-drift 4s ease-out infinite 0.8s; }
    .particle-3 { animation: particle-drift 4s ease-out infinite 1.6s; }
    .particle-4 { animation: particle-drift 4s ease-out infinite 2.4s; }
  </style>

  <!-- Canvas -->
  <rect width="540" height="380" rx="14" fill="url(#cl-bg)" stroke="#2e1065" stroke-width="1.5" />
  <rect width="540" height="380" rx="14" fill="url(#cl-grid)" opacity="0.5" />

  <!-- Header -->
  <g transform="translate(28, 28)">
    <rect width="34" height="34" rx="8" fill="#0f0c24" stroke="#818cf8" stroke-width="1.5" />
    <!-- 3D Crystal Prism Icon -->
    <polygon points="17,6 26,14 22,28 12,28 8,14" fill="url(#cl-accent)" opacity="0.9" />
    <polygon points="17,6 26,14 17,18 8,14" fill="#c7d2fe" opacity="0.7" />
    <polygon points="8,14 17,18 12,28" fill="#6366f1" opacity="0.6" />

    <text x="48" y="18" fill="#f8fafc" class="sans" font-size="18" font-weight="900">CREATIVE WEB LAB</text>
    <text x="48" y="32" fill="#818cf8" class="mono" font-size="10" font-weight="700">CINEMATIC WEB • 3D • MOTION • SHADER EXPERIMENTS</text>

    <rect x="362" y="4" width="115" height="24" rx="6" fill="#1e1065" stroke="#818cf8" stroke-width="1" />
    <text x="419" y="20" fill="#c7d2fe" class="mono" font-size="9" font-weight="800" text-anchor="middle">R&amp;D LAB</text>
  </g>

  <line x1="28" y1="78" x2="512" y2="78" stroke="#1e293b" stroke-width="1" />

  <!-- Left Column: Capabilities -->
  <g transform="translate(28, 96)">
    <!-- Card 1: Three.js & WebGL -->
    <g class="floating">
      <rect width="255" height="58" rx="8" fill="#0b0a1a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#38bdf8" />
      <text x="18" y="22" fill="#38bdf8" class="mono" font-size="10" font-weight="800">INTERACTIVE 3D</text>
      <text x="18" y="42" fill="#f8fafc" class="sans" font-size="13" font-weight="700">Three.js • WebGL • Shaders</text>
    </g>

    <!-- Card 2: Motion Design -->
    <g transform="translate(0, 68)" class="floating-delay">
      <rect width="255" height="58" rx="8" fill="#0b0a1a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#c084fc" />
      <text x="18" y="22" fill="#c084fc" class="mono" font-size="10" font-weight="800">MOTION DESIGN</text>
      <text x="18" y="42" fill="#f8fafc" class="sans" font-size="13" font-weight="700">Framer Motion • 60 FPS</text>
    </g>

    <!-- Card 3: Storytelling UI -->
    <g transform="translate(0, 136)">
      <rect width="255" height="58" rx="8" fill="#0b0a1a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#34d399" />
      <text x="18" y="22" fill="#34d399" class="mono" font-size="10" font-weight="800">NARRATIVE INTERFACES</text>
      <text x="18" y="42" fill="#f8fafc" class="sans" font-size="13" font-weight="700">Cinematic Landing Pages</text>
    </g>

    <!-- Card 4: Particle Physics -->
    <g transform="translate(0, 204)" class="floating">
      <rect width="255" height="58" rx="8" fill="#0b0a1a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#f43f5e" />
      <text x="18" y="22" fill="#f43f5e" class="mono" font-size="10" font-weight="800">PARTICLE PHYSICS</text>
      <text x="18" y="42" fill="#f8fafc" class="sans" font-size="13" font-weight="700">GPU Simulations • Canvas</text>
    </g>
  </g>

  <!-- Right Column: 3D Atom/Sphere Visualization -->
  <g transform="translate(420, 185)">
    <!-- Ambient particles -->
    <circle cx="-30" cy="-50" r="1.5" fill="#38bdf8" class="particle-1" />
    <circle cx="25" cy="-40" r="1" fill="#c084fc" class="particle-2" />
    <circle cx="-15" cy="-30" r="1.5" fill="#34d399" class="particle-3" />
    <circle cx="40" cy="-20" r="1" fill="#818cf8" class="particle-4" />

    <!-- Outer ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Animated orbital rings -->
    <ellipse cx="0" cy="0" rx="68" ry="22" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" class="ring-1" />
    <ellipse cx="0" cy="0" rx="22" ry="68" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.5" class="ring-2" />
    <ellipse cx="0" cy="0" rx="55" ry="35" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.35" class="ring-3" />

    <!-- Orbital nodes -->
    <g class="ring-1">
      <circle cx="68" cy="0" r="3" fill="#38bdf8" filter="url(#cl-soft)" />
      <circle cx="-68" cy="0" r="2" fill="#38bdf8" opacity="0.6" />
    </g>
    <g class="ring-2">
      <circle cx="0" cy="68" r="3" fill="#c084fc" filter="url(#cl-soft)" />
      <circle cx="0" cy="-68" r="2" fill="#c084fc" opacity="0.6" />
    </g>

    <!-- Inner glow core -->
    <circle cx="0" cy="0" r="20" fill="#1e1065" opacity="0.6" />
    <circle cx="0" cy="0" r="14" fill="url(#cl-accent)" opacity="0.4" filter="url(#cl-glow)" class="core-pulse" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.9" filter="url(#cl-glow)" />
  </g>

  <!-- Shader Wave Visualization (bottom) -->
  <g transform="translate(300, 310)">
    <path d="M 0 20 Q 30 0 60 20 Q 90 40 120 20 Q 150 0 180 20 Q 210 40 240 20" fill="none" stroke="url(#cl-wave)" stroke-width="2" class="wave-anim" />
    <path d="M 0 30 Q 30 10 60 30 Q 90 50 120 30 Q 150 10 180 30 Q 210 50 240 30" fill="none" stroke="url(#cl-wave)" stroke-width="1" opacity="0.4" class="wave-anim" />
  </g>

  <!-- Bottom Tech Stack Label -->
  <g transform="translate(28, 345)">
    <rect width="484" height="22" rx="4" fill="#060810" stroke="#1e293b" stroke-width="0.8" />
    <text x="14" y="15" fill="#64748b" class="mono" font-size="9">&gt; stack: React • Three.js • WebGL • GLSL • Framer Motion • Canvas API</text>
  </g>
</svg>
