<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 140" width="100%" height="100%">
  <defs>
    <filter id="hud-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .gta-cash {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 34px;
      font-style: italic;
      letter-spacing: 2px;
      fill: #54B948;
      stroke: #000;
      stroke-width: 2px;
      paint-order: stroke fill;
    }
    .gta-clock {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 20px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    @keyframes starPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    .star-flash { animation: starPulse 1.2s infinite ease-in-out; }
  </style>

  <!-- HUD Container -->
  <rect width="940" height="140" rx="10" fill="#030508" stroke="#1f2937" stroke-width="1.5" />

  <!-- LEFT: MINIMAP RADAR SIMULATOR -->
  <g transform="translate(24, 16)">
    <!-- Radar Circle Outer -->
    <circle cx="54" cy="54" r="50" fill="#080c14" stroke="#374151" stroke-width="2" />
    <circle cx="54" cy="54" r="35" fill="none" stroke="#1f2937" stroke-dasharray="3,3" />
    <circle cx="54" cy="54" r="20" fill="none" stroke="#1f2937" stroke-dasharray="2,2" />

    <!-- Grid Crosshair -->
    <line x1="4" y1="54" x2="104" y2="54" stroke="#1f2937" stroke-width="1" />
    <line x1="54" y1="4" x2="54" y2="104" stroke="#1f2937" stroke-width="1" />

    <!-- GPS Route in Purple -->
    <path d="M 54 54 Q 70 30 84 24" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />

    <!-- Player Blip (White Triangle) -->
    <polygon points="54,48 50,58 54,55 58,58" fill="#ffffff" stroke="#000" stroke-width="1" />

    <!-- Safehouse Icon Blip [H] -->
    <rect x="78" y="18" width="12" height="12" rx="2" fill="#F5AF00" stroke="#000" stroke-width="1" />
    <text x="84" y="27" font-family="'Arial Black', sans-serif" font-size="8" fill="#000" text-anchor="middle">H</text>

    <!-- Weapon Shop Blip [P] -->
    <circle cx="28" cy="74" r="5" fill="#38bdf8" stroke="#000" stroke-width="1" />
    <text x="28" y="77" font-family="'Arial Black', sans-serif" font-size="6" fill="#000" text-anchor="middle">P</text>

    <!-- Radar Labels -->
    <g transform="translate(120, 24)" class="mono">
      <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="900">LOS SANTOS // DOWNTOWN VINEWOOD</text>
      <text x="0" y="18" fill="#94a3b8" font-size="10">SAFEHOUSE: PASHA DEV REPOSITORY</text>
      <text x="0" y="34" fill="#38bdf8" font-size="9">GPS DESTINATION: NEXT.JS PROD SHIPMENT (0.2 MILES)</text>
    </g>

    <!-- Health & Armor Bottom Semicircle Bars under Radar -->
    <g transform="translate(120, 72)">
      <!-- Health Bar -->
      <text x="0" y="8" fill="#54B948" class="mono" font-size="8" font-weight="800">HEALTH</text>
      <rect x="52" y="0" width="130" height="10" rx="3" fill="#143614" stroke="#54B948" stroke-width="0.8" />
      <rect x="52" y="0" width="130" height="10" rx="3" fill="#54B948" />

      <!-- Armor Bar -->
      <text x="200" y="8" fill="#38bdf8" class="mono" font-size="8" font-weight="800">ARMOR</text>
      <rect x="250" y="0" width="130" height="10" rx="3" fill="#0c2538" stroke="#38bdf8" stroke-width="0.8" />
      <rect x="250" y="0" width="130" height="10" rx="3" fill="#38bdf8" />
    </g>
  </g>

  <!-- RIGHT: GTA V IN-GAME WEAPON, CASH & WANTED LEVEL -->
  <g transform="translate(910, 24)" text-anchor="end">
    <!-- Cash Counter -->
    <text x="0" y="16" class="gta-cash" filter="url(#hud-shadow)">$ 24,850,900</text>

    <!-- Equipped Ammo / Tech Stack -->
    <g transform="translate(0, 38)" class="mono">
      <text x="0" y="0" fill="#ffffff" font-size="11" font-weight="800">AMMO: 9999 / 9999</text>
      <text x="0" y="15" fill="#F5AF00" font-size="10" font-weight="700">PYTHON 3.12 // SYSTEMS CALIBER</text>
    </g>

    <!-- 5-Star Flashing Wanted Level -->
    <g transform="translate(-140, 68)">
      <polygon points="10,1 12,7 19,7 13,11 15,18 10,14 4,18 6,11 1,7 8,7" fill="#F5AF00" stroke="#000" stroke-width="1.2" />
      <polygon points="36,1 38,7 45,7 39,11 41,18 36,14 30,18 32,11 27,7 34,7" fill="#F5AF00" stroke="#000" stroke-width="1.2" />
      <polygon points="62,1 64,7 71,7 65,11 67,18 62,14 56,18 58,11 53,7 60,7" fill="#F5AF00" stroke="#000" stroke-width="1.2" />
      <polygon points="88,1 90,7 97,7 91,11 93,18 88,14 82,18 84,11 79,7 86,7" fill="#F5AF00" stroke="#000" stroke-width="1.2" />
      <polygon points="114,1 116,7 123,7 117,11 119,18 114,14 108,18 110,11 105,7 112,7" fill="#F5AF00" stroke="#000" stroke-width="1.2" class="star-flash" />
    </g>
  </g>
</svg>
